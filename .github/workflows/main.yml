name: Verify Lean proof

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          use-github-cache: false

      - name: Check theorem specification and axiom dependencies
        run: lake env lean -DwarningAsError=true Audit.lean
